<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volunteer Form</title>
</head>

<body>
  <h1>Volunteer Form</h1>

  <form action="http://bloomingdale.sat.iit.edu/kriedan/lab3formscript.php" method="post">
    <fieldset>
      <legend>My Info</legend>

      <div>
        <label for="first-name">first name:</label>
        <input type="text" id="first-name" name="first_name_field" size="90">
      </div>

      <div>
        <label for="last-name">last name:</label>
        <input type="text" id="last-name" name="last_name_field" size="90">
      </div>

      <div>
        <label for="phone">phone:</label>
        <input type="tel" id="phone" name="phone_field" size="90">
      </div>

      <div>
        <label for="email">email:</label>
        <input type="email" id="email" name="email_field" size="90">
      </div>

      <div>Gender:</div>
      <div>
        <label for="gender-male">Male</label>
        <input type="radio" id="gender-male" name="gender_field" value="male">
        <label for="gender-female">Female</label>
        <input type="radio" id="gender-female" name="gender_field" value="female">
      </div>

      <div>
        <label for="age">Age:</label>
      </div>
      <div>
        <select id="age" name="age_field">
          <option value="under 18">under 18</option>
          <option value="over 18">over 18</option>
        </select>
      </div>
    </fieldset>

    <fieldset>
      <legend>My Availability</legend>

      <h3>Days Available:</h3>
      <div>
        <label for="sunday">Sunday</label>
        <input type="checkbox" id="sunday" name="available_field[]" value="sunday">
      </div>
      <div>
        <label for="monday">Monday</label>
        <input type="checkbox" id="monday" name="available_field[]" value="monday">
      </div>
      <div>
        <label for="tuesday">Tuesday</label>
        <input type="checkbox" id="tuesday" name="available_field[]" value="tuesday">
      </div>
      <div>
        <label for="wednesday">Wednesday</label>
        <input type="checkbox" id="wednesday" name="available_field[]" value="wednesday">
      </div>
      <div>
        <label for="thursday">Thursday</label>
        <input type="checkbox" id="thursday" name="available_field[]" value="thursday">
      </div>
      <div>
        <label for="friday">Friday</label>
        <input type="checkbox" id="friday" name="available_field[]" value="friday">
      </div>
      <div>
        <label for="saturday">Saturday</label>
        <input type="checkbox" id="saturday" name="available_field[]" value="saturday">
      </div>

      <h3><label for="comments">Comments</label></h3>
      <textarea id="comments" name="comments_field" rows="2" cols="18"></textarea>
    </fieldset>

    <input type="hidden" name="hidden_field" value="TheoBalea">
    <input type="submit" value="Submit Query">
  </form>
</body>

</html>
